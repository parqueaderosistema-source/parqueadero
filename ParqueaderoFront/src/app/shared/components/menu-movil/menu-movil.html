@if (abierto()) {

  <div
    class="fixed inset-0 z-50 lg:hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación"
  >

    <!-- FONDO -->

    <div
      class="absolute inset-0 bg-slate-950/60"
      (click)="cerrar.emit()"
    ></div>


    <!-- PANEL -->

    <aside
      class="absolute inset-y-0 left-0 flex w-72 max-w-[85vw] flex-col bg-slate-950 shadow-2xl"
    >

      <div
        class="flex h-20 items-center justify-between border-b border-slate-800 px-5"
      >

        <div class="flex items-center">

          <div
            class="flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-500 font-bold text-slate-950"
          >
            P
          </div>

          <div class="ml-3">

            <p class="font-bold text-white">
              Parqueadero
            </p>

            <p class="text-xs text-slate-400">
              {{ subtitulo() }}
            </p>

          </div>

        </div>

        <button
          type="button"
          (click)="cerrar.emit()"
          aria-label="Cerrar menú"
          class="flex h-10 w-10 items-center justify-center rounded-xl text-slate-300 transition hover:bg-slate-900 hover:text-white"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>

      </div>


      <div class="flex-1 overflow-y-auto p-4">

        <app-menu-navegacion
          [grupos]="grupos()"
          (navegar)="cerrar.emit()"
        />

      </div>


      <div
        class="space-y-3 border-t border-slate-800 p-4"
      >

        <div
          class="rounded-xl bg-slate-900 p-4"
        >

          <p class="truncate text-sm font-semibold text-white">
            {{ nombreUsuario() }}
          </p>

          <p class="mt-1 text-xs text-slate-400">
            {{ rolUsuario() }}
          </p>

        </div>

        <button
          type="button"
          (click)="cerrarSesion.emit()"
          [disabled]="cerrandoSesion()"
          class="w-full rounded-xl border border-slate-700 px-4 py-3 text-sm font-semibold text-slate-200 transition hover:bg-slate-900 disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (cerrandoSesion()) {
            Cerrando sesión...
          } @else {
            Cerrar sesión
          }
        </button>

      </div>

    </aside>

  </div>

}
