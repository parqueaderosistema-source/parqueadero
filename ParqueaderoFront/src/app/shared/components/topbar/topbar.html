<header
  class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-slate-200 bg-white/95 px-4 backdrop-blur sm:px-6 lg:px-8"
>

  <div>

    <p
      class="text-sm text-slate-500"
    >
      Sistema de Parqueadero
    </p>

    <h2
      class="font-bold text-slate-900"
    >
      {{ titulo() }}
    </h2>

  </div>

  <div
    class="flex items-center gap-4"
  >

    <div
      class="hidden text-right sm:block"
      [attr.title]="correoUsuario() || null"
    >

      <p
        class="text-sm font-semibold text-slate-900"
      >
        {{ nombreUsuario() }}
      </p>

      <p
        class="text-xs text-slate-500"
      >
        {{ rolUsuario() }}
      </p>

    </div>

    <button
      type="button"
      (click)="cerrarSesion()"
      [disabled]="cerrandoSesion()"
      class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-60"
    >
      Cerrar sesión
    </button>

  </div>

</header>
